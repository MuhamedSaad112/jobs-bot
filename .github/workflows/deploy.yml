name: Deploy telegram bots

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TELEGRAMBOTS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TELEGRAMBOTS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TELEGRAMBOTS_AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name telegrambotsregistry

      - name: Build and Push Docker Image
        run: |
          docker build -t telegrambotsregistry.azurecr.io/jobs-bot:${{ github.sha }} .
          docker push telegrambotsregistry.azurecr.io/jobs-bot:${{ github.sha }}

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name telegram-bots \
            --resource-group telegram-bots-de-rg \
            --image telegrambotsregistry.azurecr.io/jobs-bot:${{ github.sha }}
