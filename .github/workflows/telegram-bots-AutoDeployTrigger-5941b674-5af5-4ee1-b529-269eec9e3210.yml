name: Deploy telegram bots

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TELEGRAMBOTS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TELEGRAMBOTS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TELEGRAMBOTS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and Deploy
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          containerAppName: telegram-bots
          resourceGroup: telegram-bots-de-rg
